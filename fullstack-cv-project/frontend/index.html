<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CareerForge | CV Project Builder</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <p class="eyebrow">Full-Stack Portfolio Project</p>
        <h1>CareerForge</h1>
        <p>Build, track, and showcase your strongest technical projects for your CV.</p>
      </header>

      <section class="card">
        <h2>Add Project</h2>
        <form id="project-form">
          <label>Project title<input name="title" required minlength="3" /></label>
          <label>Summary<textarea name="summary" required minlength="10"></textarea></label>
          <label>Stack (comma-separated)<input name="stack" required /></label>
          <label>Impact statement<input name="impact" required minlength="5" /></label>
          <label>
            Status
            <select name="status">
              <option value="planned">Planned</option>
              <option value="in-progress" selected>In Progress</option>
              <option value="completed">Completed</option>
            </select>
          </label>
          <button type="submit">Save Project</button>
        </form>
      </section>

      <section class="card">
        <div class="row">
          <h2>Project Showcase</h2>
          <select id="status-filter">
            <option value="all">All statuses</option>
            <option value="planned">Planned</option>
            <option value="in-progress">In Progress</option>
            <option value="completed">Completed</option>
          </select>
        </div>
        <ul id="projects-list"></ul>
      </section>
    </main>

    <template id="project-template">
      <li class="project-item">
        <div>
          <h3 class="title"></h3>
          <p class="summary"></p>
          <p class="stack"></p>
          <p class="impact"></p>
        </div>
        <div class="actions">
          <span class="status-pill"></span>
          <select class="status-select">
            <option value="planned">Planned</option>
            <option value="in-progress">In Progress</option>
            <option value="completed">Completed</option>
          </select>
        </div>
      </li>
    </template>

    <script type="module" src="app.js"></script>
  </body>
</html>
